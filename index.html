      "This is the name of Villanova basketball's practice facility, named for former trainer Jake Nevin."
    ]
  },
  {
    id: "villanova-stadium",
    category: "Villanova Athletics",
    answer: "Villanova Stadium",
    aliases: ["villanova stadium", "the stadium", "villanova football stadium"],
    clues: [
      // Clue 1 - hardest
      "Villanova's football team plays at the FCS level — a tier below major programs like Alabama or Ohio State.",
      // Clue 2
      // CONFIDENCE-CHECK: exact championship year (believed 2009).
      "The football team has won a national championship at this level, including a title in the 2000s.",
      // Clue 3
      // CONFIDENCE-CHECK: confirm the football team's conference (believed CAA).
      "Unlike the men's basketball team, which plays in the Big East, the football team competes in a different conference (the CAA).",
      // Clue 4
      "This is the venue where Villanova's football team, the Wildcats, play their home games.",
      // Clue 5 - easiest
      "This is the name of Villanova's on-campus football stadium."
    ]
  }
];

const POINTS_BY_CLUE = [100, 80, 60, 40, 20]; // clue 1 -> 100, clue 5 -> 20
const SEASON_NUMBER = 1;

// Day 1 of the season. Local date, no timezone conversion.
const LAUNCH_DATE = new Date(2026, 6, 27); // July 27, 2026 (month is 0-indexed)


// ------------------------------------------------------------
// 2. WHICH DAY IS IT? (deterministic, not random)
// ------------------------------------------------------------

function getTodayDayIndex() {
  // Dev/testing convenience: ?day=N in the URL overrides the real date.
  const params = new URLSearchParams(window.location.search);
  if (params.has("day")) {
    return parseInt(params.get("day"), 10);
  }

  const now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const startOfLaunch = new Date(LAUNCH_DATE.getFullYear(), LAUNCH_DATE.getMonth(), LAUNCH_DATE.getDate());
  const msPerDay = 24 * 60 * 60 * 1000;

  return Math.round((startOfToday - startOfLaunch) / msPerDay);
}


// ------------------------------------------------------------
// 3. GUESS MATCHING (no backend, no AI service — just strings)
// ------------------------------------------------------------

function normalize(str) {
  return str
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9\s]/g, "") // strip punctuation like apostrophes/periods
    .replace(/\s+/g, " ");
}

// Standard Levenshtein edit-distance: how many single-character edits
// (insert/delete/substitute) turn string a into string b.
function levenshtein(a, b) {
  const m = a.length;
  const n = b.length;
  const dp = [];

  for (let i = 0; i <= m; i++) {
    dp.push([i]);
  }
  for (let j = 0; j <= n; j++) {
    dp[0][j] = j;
  }

  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      if (a[i - 1] === b[j - 1]) {
        dp[i][j] = dp[i - 1][j - 1];
      } else {
        dp[i][j] = 1 + Math.min(
          dp[i - 1][j],     // delete
          dp[i][j - 1],     // insert
          dp[i - 1][j - 1]  // substitute
        );
      }
    }
  }

  return dp[m][n];
}

// How many edits are we willing to forgive for a given alias length?
// Short answers get less wiggle room, long ones get more.
function closeEnoughThreshold(normalizedAlias) {
  return Math.max(1, Math.floor(normalizedAlias.length * 0.3));
}

// Compares the player's guess against every accepted alias and returns
// the closest one, e.g. { alias: "jay wright", distance: 0 }
function findBestAliasMatch(guess, aliases) {
  const normGuess = normalize(guess);
  let best = null;

  for (const alias of aliases) {
    const normAlias = normalize(alias);
    const distance = levenshtein(normGuess, normAlias);
    if (best === null || distance < best.distance) {
      best = { alias, normAlias, distance };
    }
  }

  return best;
}

// Returns "correct", "maybe", or "wrong" for a guess against a subject.
function evaluateGuess(guess, subject) {
  const best = findBestAliasMatch(guess, subject.aliases);

  if (best.distance === 0) {
    return "correct";
  }
  if (best.distance <= closeEnoughThreshold(best.normAlias)) {
    return "maybe";
  }
  return "wrong";
}


// ------------------------------------------------------------
// 4. GAME STATE (saved to localStorage so refresh doesn't lose progress)
// ------------------------------------------------------------

function stateKey(dayIndex) {
  return "novaTrivia_day_" + dayIndex;
}

function loadState(dayIndex) {
  const raw = localStorage.getItem(stateKey(dayIndex));
  if (raw) {
    return JSON.parse(raw);
  }
  // Fresh state: on clue 1 (index 0), still playing.
  return {
    clueIndex: 0,
    status: "playing", // "playing" | "won" | "lost"
    wonAtClue: null,
    scoreCounted: false
  };
}

function saveState(dayIndex, state) {
  localStorage.setItem(stateKey(dayIndex), JSON.stringify(state));
}

function getTotalScore() {
  return parseInt(localStorage.getItem("novaTrivia_totalScore") || "0", 10);
}

function addToTotalScore(points) {
  const newTotal = getTotalScore() + points;
  localStorage.setItem("novaTrivia_totalScore", String(newTotal));
  return newTotal;
}


// ------------------------------------------------------------
// 5. RENDERING (plain DOM updates, no framework, no styling yet)
// ------------------------------------------------------------

let dayIndex;
let subject;
let state;

function init() {
  dayIndex = getTodayDayIndex();

  if (dayIndex < 0) {
    renderNotLaunchedYet();
    return;
  }

  if (dayIndex >= SUBJECTS.length) {
    renderSeasonComplete();
    return;
  }

  subject = SUBJECTS[dayIndex];
  state = loadState(dayIndex);

  render();
}

function renderNotLaunchedYet() {
  document.getElementById("app").innerHTML =
    '<div class="season-message">' +
    "<p>The game hasn't launched yet. Check back soon.</p>" +
    "</div>";
}

function renderSeasonComplete() {
  document.getElementById("app").innerHTML =
    '<div class="season-message">' +
    "<p class=\"result-heading\">Season " + SEASON_NUMBER + " complete!</p>" +
    "<p>Thanks for playing every puzzle.</p>" +
    "<p class=\"points-earned\">Your lifetime score: " + getTotalScore() + "</p>" +
    "<p>Season " + (SEASON_NUMBER + 1) + " is coming soon.</p>" +
    "</div>";
}

// Builds the row of small dots showing which clue you're on (or won at).
// state.clueIndex is always the furthest clue revealed so far, so dots
// 0..clueIndex are "revealed" — the won clue (if any) turns green instead.
function buildProgressDotsHtml() {
  const totalClues = 5;
  let html = '<div class="progress-dots">';
  for (let i = 0; i < totalClues; i++) {
    let classes = "dot";
    if (state.status === "won" && i === state.wonAtClue) {
      classes += " won";
    } else if (i <= state.clueIndex) {
      classes += " revealed";
    }
    html += '<div class="' + classes + '"></div>';
  }
  html += "</div>";
  return html;
}

function render() {
  const app = document.getElementById("app");

  let html = "";
  html += '<div class="day-label">Day ' + (dayIndex + 1) + " of " + SUBJECTS.length + "</div>";
  html += '<span class="category-badge">' + subject.category + "</span>";
  html += buildProgressDotsHtml();

  // Show every clue revealed so far (0..clueIndex), numbered.
  html += '<ol class="clue-list">';
  for (let i = 0; i <= state.clueIndex && i < subject.clues.length; i++) {
    html += '<li class="clue-item"><span class="clue-number">' + (i + 1) + "</span>" +
      '<span class="clue-text">' + subject.clues[i] + "</span></li>";
  }
  html += "</ol>";

  if (state.status === "playing") {
    html += '<form id="guessForm" class="guess-form">';
    html += '<input type="text" id="guessInput" class="guess-input" autocomplete="off" placeholder="Your guess">';
    html += '<button type="submit" class="guess-btn">Guess</button>';
    html += "</form>";
  } else if (state.status === "won") {
    html += '<p class="result-heading won">Correct!</p>';
    html += '<p class="result-answer">The answer was ' + subject.answer + ".</p>";
    html += '<p class="points-earned">+' + POINTS_BY_CLUE[state.wonAtClue] + " points today</p>";
    html += renderResultFooter();
  } else if (state.status === "lost") {
    html += '<p class="result-heading lost">Out of clues</p>';
    html += '<p class="result-answer">The answer was ' + subject.answer + ".</p>";
    html += '<p class="points-earned">+0 points today</p>';
    html += renderResultFooter();
  }

  app.innerHTML = html;

  if (state.status === "playing") {
    document.getElementById("guessForm").addEventListener("submit", onGuessSubmit);
  } else {
    const shareBtn = document.getElementById("shareBtn");
    if (shareBtn) {
      shareBtn.addEventListener("click", onShareClick);
    }
  }
}

function renderResultFooter() {
  let html = "";
  html += '<div class="share-box">' + buildShareText() + "</div>";
  html += '<button id="shareBtn" class="share-btn">Copy share result</button>';
  html += '<p class="lifetime-score">Lifetime score: ' + getTotalScore() + "</p>";
  return html;
}

function buildShareText() {
  const squares = [];
  for (let i = 0; i < 5; i++) {
    if (state.status === "won" && i === state.wonAtClue) {
      squares.push("🟩");
    } else {
      squares.push("⬜");
    }
  }

  const clueLabel = state.status === "won" ? (state.wonAtClue + 1) + "/5" : "X/5";

  return "Nova Trivia #" + (dayIndex + 1) + " — Clue " + clueLabel + "\n" + squares.join("");
}

function onShareClick() {
  const text = buildShareText();
  navigator.clipboard.writeText(text).then(function () {
    alert("Copied to clipboard:\n\n" + text);
  }, function () {
    // Clipboard API can fail (e.g. non-HTTPS context); fall back to showing it.
    alert("Copy this manually:\n\n" + text);
  });
}

function onGuessSubmit(event) {
  event.preventDefault();

  const input = document.getElementById("guessInput");
  const guess = input.value;
  if (!guess.trim()) {
    return;
  }

  const result = evaluateGuess(guess, subject);

  if (result === "correct") {
    handleCorrect();
    return;
  }

  if (result === "maybe") {
    // Free confirmation — does NOT cost a guess either way.
    const confirmed = window.confirm('Did you mean "' + subject.answer + '"?');
    if (confirmed) {
      handleCorrect();
    } else {
      handleWrong();
    }
    return;
  }

  handleWrong();
}

function handleCorrect() {
  state.status = "won";
  state.wonAtClue = state.clueIndex;

  if (!state.scoreCounted) {
    addToTotalScore(POINTS_BY_CLUE[state.wonAtClue]);
    state.scoreCounted = true;
  }

  saveState(dayIndex, state);
  render();
}

function handleWrong() {
  const isLastClue = state.clueIndex >= subject.clues.length - 1;

  if (isLastClue) {
    state.status = "lost";
    if (!state.scoreCounted) {
      addToTotalScore(0);
      state.scoreCounted = true;
    }
  } else {
    state.clueIndex += 1;
  }

  saveState(dayIndex, state);
  render();
}


// ------------------------------------------------------------
// GO
// ------------------------------------------------------------
init();

</script>

</body>
</html>
