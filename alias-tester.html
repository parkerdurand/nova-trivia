// ------------------------------------------------------------
// Same matching logic as nova-trivia.html
// ------------------------------------------------------------
function normalize(str) {
  return str
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9\s]/g, "")
    .replace(/\s+/g, " ");
}

function levenshtein(a, b) {
  const m = a.length;
  const n = b.length;
  const dp = [];
  for (let i = 0; i <= m; i++) dp.push([i]);
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      if (a[i - 1] === b[j - 1]) {
        dp[i][j] = dp[i - 1][j - 1];
      } else {
        dp[i][j] = 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
      }
    }
  }
  return dp[m][n];
}

function closeEnoughThreshold(normalizedAlias) {
  return Math.max(1, Math.floor(normalizedAlias.length * 0.3));
}

function findBestAliasMatch(guess, aliases) {
  const normGuess = normalize(guess);
  let best = null;
  for (const alias of aliases) {
    const normAlias = normalize(alias);
    const distance = levenshtein(normGuess, normAlias);
    if (best === null || distance < best.distance) {
      best = { alias, normAlias, distance };
    }
  }
  return best;
}

function evaluateGuess(guess, subject) {
  const best = findBestAliasMatch(guess, subject.aliases);
  const threshold = closeEnoughThreshold(best.normAlias);
  let verdict;
  if (best.distance === 0) {
    verdict = "correct";
  } else if (best.distance <= threshold) {
    verdict = "maybe";
  } else {
    verdict = "wrong";
  }
  return { verdict, best, threshold };
}

const subjectSelect = document.getElementById("subjectSelect");
const acceptedList = document.getElementById("acceptedList");
const guessInput = document.getElementById("guessInput");
const resultDiv = document.getElementById("result");
const detailDiv = document.getElementById("detail");

  const opt = document.createElement("option");
  opt.value = index;
  opt.textContent = subject.answer + " (" + subject.category + ")";
  subjectSelect.appendChild(opt);
});

function currentSubject() {
  return SUBJECTS[parseInt(subjectSelect.value, 10)];
}

function renderAcceptedList() {
  const subject = currentSubject();
  acceptedList.textContent = "Answer: " + subject.answer + "\nAliases: " + subject.aliases.join(", ");
}

function checkGuess() {
  const guess = guessInput.value;
  if (!guess.trim()) {
    resultDiv.textContent = "";
    detailDiv.textContent = "";
    return;
  }

  const subject = currentSubject();
  const { verdict, best, threshold } = evaluateGuess(guess, subject);

  if (verdict === "correct") {
    resultDiv.textContent = "✅ CORRECT — exact match";
  } else if (verdict === "maybe") {
    resultDiv.textContent = '🤔 "Did you mean \'' + subject.answer + '\'?" (free confirm, no penalty)';
  } else {
    resultDiv.textContent = "❌ WRONG — not recognized, would advance to next clue";
  }

  detailDiv.textContent =
    "Closest alias: \"" + best.alias + "\" — edit distance " + best.distance +
    " (allowed up to " + threshold + " for a 'maybe')";
}

subjectSelect.addEventListener("change", function () {
  renderAcceptedList();
  resultDiv.textContent = "";
  detailDiv.textContent = "";
});
document.getElementById("checkBtn").addEventListener("click", checkGuess);

  if (e.key === "Enter") checkGuess();
